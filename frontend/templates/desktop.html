{% extends "base.html" %}

{% block head %}
<style>
    /* Boot splash */
    #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #020617;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
    }
    #boot-splash.fade-out { opacity: 0; pointer-events: none; }
    #boot-splash .logo { font-size: 2rem; font-weight: 700; color: #f8fafc; margin-bottom: 1rem; }
    #boot-splash .logo span { color: #ec4899; }
    #boot-splash .progress-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    #boot-splash .progress-fill { height: 100%; background: linear-gradient(90deg, #ec4899, #8b5cf6); width: 0%; transition: width 0.3s ease; }
    #boot-splash .status { color: #64748b; font-size: 0.75rem; margin-top: 0.75rem; }
</style>
{% endblock %}

{% block body %}
<!-- Boot Splash -->
<div id="boot-splash" role="status" aria-live="polite" aria-label="Booting PiNetOS">
    <div class="logo">PiNet<span>OS</span></div>
    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="boot-progressbar"><div class="progress-fill" id="boot-progress"></div></div>
    <div class="status" id="boot-status">Initializing kernel...</div>
</div>

<!-- Top Bar -->
<header id="topbar" role="banner">
    <div class="topbar-left">
        <span class="topbar-logo">PiNet<span class="accent">OS</span></span>
        <span class="topbar-version">v{{ version }}</span>
        <span class="topbar-sep">|</span>
        <span id="os-mode" class="topbar-badge" title="Active OS profile">pinet</span>
        <span class="topbar-badge" title="Backend stack" style="background:rgba(139,92,246,0.15);color:#a78bfa">python · fastapi</span>
    </div>
    <div class="topbar-center" role="status" aria-label="System statistics">
        <div class="stat-group">
            <span class="stat-label">CPU</span>
            <span class="stat-value" id="stat-cpu">0%</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">RAM</span>
            <span class="stat-value" id="stat-ram">0%</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Temp</span>
            <span class="stat-value" id="stat-temp">0°C</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Disk</span>
            <span class="stat-value" id="stat-disk">0%</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Block</span>
            <span class="stat-value" id="stat-block">0</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Peers</span>
            <span class="stat-value" id="stat-peers">0</span>
        </div>
    </div>
    <div class="topbar-right">
        <span id="clock" aria-label="Current time"></span>
    </div>
</header>

<!-- Desktop -->
<main id="desktop" role="main" aria-label="Desktop application launcher">
    <div id="app-grid">
        <!-- App icons rendered by JS -->
    </div>
</main>

<!-- Window container -->
<div id="windows-layer" aria-live="polite"></div>

<!-- Taskbar -->
<footer id="taskbar" role="navigation" aria-label="Open windows">
    <div id="taskbar-items"></div>
</footer>
{% endblock %}

{% block scripts %}
<script src="/static/js/api.js"></script>
<script src="/static/js/window-manager.js"></script>
<script src="/static/js/terminal.js"></script>
<script src="/static/js/app.js"></script>
{% endblock %}
