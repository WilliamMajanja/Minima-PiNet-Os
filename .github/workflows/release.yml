name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Raspberry Pi boot configuration
        run: npm run release:validate-boot

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "semver=$(echo '${{ inputs.tag_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "semver=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Create source archives
        run: |
          ARCHIVE_BASE="Minima-PiNet-Os-${{ steps.version.outputs.tag }}"
          ARCHIVE_PREFIX="${ARCHIVE_BASE}/"

          git archive --format=zip --prefix="${ARCHIVE_PREFIX}" HEAD -o "${ARCHIVE_BASE}.zip"
          git archive --format=tar.gz --prefix="${ARCHIVE_PREFIX}" HEAD -o "${ARCHIVE_BASE}.tar.gz"

          ls -lh "${ARCHIVE_BASE}.zip" "${ARCHIVE_BASE}.tar.gz"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools

      - name: Generate Raspberry Pi disk image
        run: bash scripts/create-release-img.sh "${{ steps.version.outputs.semver }}"

      - name: Package disk image for release
        run: node scripts/package-img-release.js "${{ steps.version.outputs.semver }}"

      - name: Generate release package artifacts
        run: node scripts/generate-release-packages.js

      - name: Generate SHA256 checksums
        run: |
          sha256sum \
            "Minima-PiNet-Os-${{ steps.version.outputs.tag }}.zip" \
            "Minima-PiNet-Os-${{ steps.version.outputs.tag }}.tar.gz" \
            PiNetOS-RaspberryPi.img \
            PiNetOS-RaspberryPi-Package-*.zip \
            PiNetOS-Enterprise.zip \
            PiNetOS-Electron-Desktop.zip \
            PiNetOS-Build-System.zip \
            PiNetOS-Documentation.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "Release of Minima-PiNet-Os ${{ steps.version.outputs.tag }}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Minima-PiNet-Os ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            Minima-PiNet-Os-${{ steps.version.outputs.tag }}.zip
            Minima-PiNet-Os-${{ steps.version.outputs.tag }}.tar.gz
            PiNetOS-RaspberryPi.img
            PiNetOS-RaspberryPi-Package-*.zip
            PiNetOS-Enterprise.zip
            PiNetOS-Electron-Desktop.zip
            PiNetOS-Build-System.zip
            PiNetOS-Documentation.zip
            SHA256SUMS.txt
