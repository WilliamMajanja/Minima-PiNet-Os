---
# Network Policies — namespace-scoped zero-trust network segmentation
# Default-deny ingress AND egress in each namespace, then allowlist specific
# pod-to-pod communication paths required by the PiNet stack.
#
# Requires a CNI that supports NetworkPolicy (K3s with Flannel + netpol
# controller, or Calico / Cilium).
#
# Live-cluster ready — includes egress lockdown, DNS allowlists, and
# Traefik ingress-controller source rules.

# =============================================================================
# pinet-system namespace
# =============================================================================

# Default-deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pinet-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default-deny all egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: pinet-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow all pods in pinet-system to reach kube-dns for name resolution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: pinet-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow PiNet Desktop to receive traffic from Traefik ingress controller
# and via NodePort
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pinet-desktop-ingress
  namespace: pinet-system
spec:
  podSelector:
    matchLabels:
      app: pinet-desktop
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
    # NodePort traffic (source is any node IP)
    - ports:
        - port: 3000
          protocol: TCP
---
# Allow PiNet Desktop egress to Minima RPC and to the Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pinet-desktop-egress
  namespace: pinet-system
spec:
  podSelector:
    matchLabels:
      app: pinet-desktop
  policyTypes:
    - Egress
  egress:
    # → Minima RPC/P2P/Maxima within the namespace
    - to:
        - podSelector:
            matchLabels:
              app: minima
      ports:
        - port: 9001
          protocol: TCP
        - port: 9002
          protocol: TCP
        - port: 9003
          protocol: TCP
    # → Kubernetes API server (K3s service CIDR for cluster health/status)
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - port: 6443
          protocol: TCP
---
# Allow Minima pods to receive RPC, P2P, and Maxima traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minima-ingress
  namespace: pinet-system
spec:
  podSelector:
    matchLabels:
      app: minima
  policyTypes:
    - Ingress
  ingress:
    # From PiNet Desktop (in-cluster)
    - from:
        - podSelector:
            matchLabels:
              app: pinet-desktop
      ports:
        - port: 9001
          protocol: TCP
        - port: 9002
          protocol: TCP
        - port: 9003
          protocol: TCP
    # P2P and Maxima traffic from other Minima pods and external peers
    - ports:
        - port: 9001
          protocol: TCP
        - port: 9002
          protocol: TCP
        - port: 9003
          protocol: TCP
---
# Allow Minima egress for P2P network participation and Maxima messaging
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minima-egress
  namespace: pinet-system
spec:
  podSelector:
    matchLabels:
      app: minima
  policyTypes:
    - Egress
  egress:
    # P2P / Maxima — needs to reach other Minima peers on the internet
    - ports:
        - port: 9001
          protocol: TCP
        - port: 9002
          protocol: TCP
        - port: 9003
          protocol: TCP

# =============================================================================
# zedd-weather namespace
# =============================================================================
---
# Default-deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: zedd-weather
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default-deny all egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: zedd-weather
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow all pods in zedd-weather to reach kube-dns
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: zedd-weather
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow Grafana ingress from Traefik and NodePort traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
    - ports:
        - port: 3000
          protocol: TCP
---
# Allow Grafana egress to InfluxDB for dashboard queries
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: influxdb
      ports:
        - port: 8086
          protocol: TCP
---
# Allow InfluxDB ingress from Grafana and Zedd Weather sensor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-influxdb-ingress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: influxdb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
        - podSelector:
            matchLabels:
              app: zedd-weather
      ports:
        - port: 8086
          protocol: TCP
    # Traefik for the influxdb.pinet.local Ingress route
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8086
          protocol: TCP
---
# Allow Open WebUI ingress from Traefik and NodePort traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-open-webui-ingress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
    - ports:
        - port: 8080
          protocol: TCP
---
# Allow Open WebUI egress to Ollama for inference requests
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-open-webui-egress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - port: 11434
          protocol: TCP
---
# Allow Ollama ingress from Open WebUI only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-ingress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: open-webui
      ports:
        - port: 11434
          protocol: TCP
---
# Allow Zedd Weather sensor pod to receive liveness probes and send data
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-zedd-weather-ingress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: zedd-weather
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9200
          protocol: TCP
---
# Allow Zedd Weather egress to InfluxDB for telemetry writes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-zedd-weather-egress
  namespace: zedd-weather
spec:
  podSelector:
    matchLabels:
      app: zedd-weather
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: influxdb
      ports:
        - port: 8086
          protocol: TCP
