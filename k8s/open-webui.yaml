---
# Open WebUI — browser-based chat interface pointing to Ollama on pinet-sigma
# Scheduled on pinet-alpha (NVMe) to serve the web UI with fast disk I/O.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: zedd-weather
  labels:
    app: open-webui
    component: ai-interface
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: open-webui
        component: ai-interface
    spec:
      nodeSelector:
        storage: nvme
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OLLAMA_BASE_URL
              # pinet-sigma hosts the Ollama inference engine on port 11434
              value: "http://pinet-sigma:11434"
            - name: WEBUI_AUTH
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: secret-key
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: zedd-weather
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-secret
  namespace: zedd-weather
type: Opaque
stringData:
  secret-key: "change-me-strong-secret-key-32ch"
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: zedd-weather
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# Ollama Service — points to pinet-sigma's external Ollama daemon.
# Provides stable in-cluster DNS for the Open WebUI OLLAMA_BASE_URL.
apiVersion: v1
kind: Service
metadata:
  name: pinet-sigma
  namespace: zedd-weather
  labels:
    app: ollama-proxy
spec:
  type: ExternalName
  externalName: pinet-sigma.local
  ports:
    - name: ollama
      port: 11434
      targetPort: 11434
