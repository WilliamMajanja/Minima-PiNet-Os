---
# InfluxDB v2 — time-series telemetry database for Zedd Weather
# Scheduled on pinet-alpha (NVMe storage node) for fast I/O performance.
#
# BEFORE APPLYING: create the influxdb-secret first:
#   kubectl create namespace zedd-weather
#   kubectl create secret generic influxdb-secret \
#     --namespace zedd-weather \
#     --from-literal=admin-token=<strong-token> \
#     --from-literal=admin-password=<strong-password>
# See k8s/influxdb-secret.yaml.template for details.
apiVersion: v1
kind: Namespace
metadata:
  name: zedd-weather
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-pvc
  namespace: zedd-weather
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: zedd-weather
  labels:
    app: influxdb
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: influxdb
        component: database
    spec:
      nodeSelector:
        storage: nvme
      containers:
        - name: influxdb
          image: influxdb:2.7-alpine
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "admin"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: influxdb-secret
                  key: admin-password
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "zedd-weather"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "sensor-data"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-secret
                  key: admin-token
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: influxdb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: zedd-weather
  labels:
    app: influxdb
spec:
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: 8086
  type: ClusterIP
