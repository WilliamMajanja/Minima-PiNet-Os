---
# Resource Quotas & Limit Ranges — per-namespace resource guardrails
# Prevents runaway pods from starving the cluster during a live test.
# Tuned for a 3-node Raspberry Pi 5 (16 GB) cluster (48 GB total).

# =============================================================================
# pinet-system namespace
# =============================================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: pinet-system-quota
  namespace: pinet-system
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    pods: "50"
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pinet-system-limits
  namespace: pinet-system
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 8Gi

# =============================================================================
# zedd-weather namespace
# =============================================================================
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zedd-weather-quota
  namespace: zedd-weather
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    pods: "30"
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: zedd-weather-limits
  namespace: zedd-weather
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 12Gi
