# PiNetOS OTA Update Configuration
# /etc/pinetos/ota.conf
# =============================================

# Update server base URL
UPDATE_SERVER=https://updates.pinetos.io

# Release channel: stable | beta | nightly
RELEASE_CHANNEL=stable

# Automatically reboot after update (true/false)
AUTO_REBOOT=false

# Create backup before applying updates (true/false)
BACKUP_BEFORE_UPDATE=true

# Verify GPG signature of update payload (true/false)
VERIFY_SIGNATURE=true

# Maximum download timeout in seconds
DOWNLOAD_TIMEOUT=600

# Minimum free disk space required before updating (MB)
MIN_FREE_DISK_MB=500
