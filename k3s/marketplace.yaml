apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: pinet-system
  labels:
    app: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      containers:
        - name: marketplace
          image: ghcr.io/williammajanja/pinet-marketplace:latest
          ports:
            - containerPort: 4192
              name: marketplace-api
          env:
            - name: PINET_MARKETPLACE
              value: "1"
            - name: PINET_MARKETPLACE_MAX_LISTINGS
              value: "100"
            - name: PINET_MARKETPLACE_ESCROW_TOKENS
              value: "minima"
            - name: MINIMA_RPC_URL
              value: "http://minima-service.pinet-system:9005"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4192
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4192
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace
  namespace: pinet-system
spec:
  selector:
    app: marketplace
  ports:
    - port: 4192
      targetPort: marketplace-api
      name: marketplace-api
