---
# Minima Blockchain Node — DaemonSet
# Runs one Minima validator on every cluster node so each Pi participates
# in the Minima Layer 1 network independently.  Data is stored on a
# hostPath volume unique to each node.
#
# Port layout: P2P=9001, MDS-file=9003, MDS-cmd=9004, RPC=9005
# The RPC port (9005) is used for all command communication.
apiVersion: v1
kind: Namespace
metadata:
  name: pinet-system
  labels:
    app.kubernetes.io/part-of: pinet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minima-config
  namespace: pinet-system
data:
  MINIMA_P2P_PORT: "9001"
  MINIMA_RPC_PORT: "9005"
  MINIMA_AUTOCONNECT: "true"
  MINIMA_MAXIMA: "true"
  MINIMA_MDS_ENABLE: "true"
  MINIMA_JVM_OPTS: "-Xmx512m"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: minima
  namespace: pinet-system
  labels:
    app: minima
    component: blockchain
    app.kubernetes.io/part-of: pinet
spec:
  selector:
    matchLabels:
      app: minima
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: minima
        component: blockchain
    spec:
      tolerations:
        - operator: Exists
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: minima
          image: minimaglobal/minima:v1.0.49
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: p2p
              containerPort: 9001
              protocol: TCP
            - name: mds-file
              containerPort: 9003
              protocol: TCP
            - name: mds-cmd
              containerPort: 9004
              protocol: TCP
            - name: rpc
              containerPort: 9005
              protocol: TCP
          env:
            - name: MINIMA_P2P_PORT
              valueFrom:
                configMapKeyRef:
                  name: minima-config
                  key: MINIMA_P2P_PORT
            - name: MINIMA_RPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: minima-config
                  key: MINIMA_RPC_PORT
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: minima-config
                  key: MINIMA_JVM_OPTS
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: minima-data
              mountPath: /home/minima
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /status
              port: rpc
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: minima-data
          hostPath:
            path: /var/lib/pinet/minima
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minima
  namespace: pinet-system
  labels:
    app: minima
spec:
  selector:
    app: minima
  ports:
    - name: p2p
      port: 9001
      targetPort: 9001
    - name: mds-file
      port: 9003
      targetPort: 9003
    - name: mds-cmd
      port: 9004
      targetPort: 9004
    - name: rpc
      port: 9005
      targetPort: 9005
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: minima-external
  namespace: pinet-system
  labels:
    app: minima
spec:
  selector:
    app: minima
  ports:
    - name: rpc
      port: 9005
      targetPort: 9005
      nodePort: 30905
    - name: p2p
      port: 9001
      targetPort: 9001
      nodePort: 30901
  type: NodePort