---
# Zedd Weather — sensor data-collection deployment
# Runs exclusively on pinet-rho (the Sense HAT node) via nodeSelector.
# Requires privileged I2C access to communicate with the Sense HAT hardware.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zedd-weather
  namespace: zedd-weather
  labels:
    app: zedd-weather
    component: edge-sensor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zedd-weather
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zedd-weather
        component: edge-sensor
    spec:
      # Pin to the Sense HAT node
      nodeSelector:
        sensor: sense-hat

      # Allow reading /dev/i2c-* on the host
      securityContext:
        # Group 998 = i2c on Raspberry Pi OS Bookworm; grants access to
        # /dev/i2c-* without running as root.
        supplementalGroups:
          - 998
        runAsNonRoot: true
        runAsUser: 1001

      containers:
        - name: zedd-weather
          # Replace with your registry/tag after building with:
          #   docker buildx build --platform linux/arm64 -t <registry>/zedd-weather:latest .
          image: ghcr.io/williammajanja/zedd-weather:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          env:
            - name: INFLUXDB_URL
              value: "http://influxdb.zedd-weather.svc.cluster.local:8086"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-secret
                  key: admin-token
            - name: INFLUXDB_ORG
              value: "zedd-weather"
            - name: INFLUXDB_BUCKET
              value: "sensor-data"
            - name: SENSOR_INTERVAL
              value: "10"
            # Kubernetes Downward API — injects the node name for tagging
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # Mount /dev/i2c-* from the host so the container can reach the
          # physical Sense HAT over I2C bus 1.
          volumeMounts:
            - name: i2c-bus
              mountPath: /dev/i2c-1
            - name: i2c-bus-0
              mountPath: /dev/i2c-0

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: i2c-bus
          hostPath:
            path: /dev/i2c-1
            type: CharDevice
        - name: i2c-bus-0
          hostPath:
            path: /dev/i2c-0
            type: CharDevice
