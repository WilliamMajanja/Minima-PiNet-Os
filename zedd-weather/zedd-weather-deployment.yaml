---
# Zedd Weather — sensor data-collection deployment
# Runs on any Raspberry Pi node with a Sense HAT attached.
# Supports: Pi 5, Pi 4, Pi 3, Pi 2, Pi 1, Pi Zero 2 W, Compute Module 3/4
#
# The nodeSelector uses a generic 'sensor: sense-hat' label that should be
# applied to whichever Pi node has the Sense HAT physically attached.
# For Pi Zero / Pi 1, reduce resource limits accordingly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zedd-weather
  namespace: zedd-weather
  labels:
    app: zedd-weather
    component: edge-sensor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zedd-weather
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zedd-weather
        component: edge-sensor
    spec:
      # Pin to the Sense HAT node
      nodeSelector:
        sensor: sense-hat

      # Allow reading /dev/i2c-* on the host
      # Group 998 = i2c on Raspberry Pi OS Bookworm
      # Group 108 = i2c on some Debian-based distros
      securityContext:
        supplementalGroups:
          - 998
          - 108
        runAsNonRoot: true
        runAsUser: 1001

      containers:
        - name: zedd-weather
          # Multi-arch image: builds for linux/arm64 (Pi 5/4/3) and linux/arm/v7 (Pi 2/1/Zero)
          image: ghcr.io/williammajanja/zedd-weather:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          env:
            - name: INFLUXDB_URL
              value: "http://influxdb.zedd-weather.svc.cluster.local:8086"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-secret
                  key: admin-token
            - name: INFLUXDB_ORG
              value: "zedd-weather"
            - name: INFLUXDB_BUCKET
              value: "sensor-data"
            - name: SENSOR_INTERVAL
              value: "10"
            # Override PLATFORM detection if needed (pi5, pi4, pi3, pi2, pi1, zero, zero2w, cm4, cm3, generic)
            # - name: PLATFORM
            #   value: "pi5"
            # Kubernetes Downward API — injects the node name for tagging
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # Mount /dev/i2c-* from the host so the container can reach the
          # physical Sense HAT over I2C bus 1 (and bus 0 on Pi 5).
          volumeMounts:
            - name: i2c-bus
              mountPath: /dev/i2c-1
            - name: i2c-bus-0
              mountPath: /dev/i2c-0
            - name: dev-gpiomem
              mountPath: /dev/gpiomem

          # Resource limits: adjusted for Pi Zero/1 (lower) vs Pi 4/5 (higher)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 15

      volumes:
        - name: i2c-bus
          hostPath:
            path: /dev/i2c-1
            type: CharDevice
        - name: i2c-bus-0
          hostPath:
            path: /dev/i2c-0
            type: CharDevice
        - name: dev-gpiomem
          hostPath:
            path: /dev/gpiomem
            type: CharDevice