# PiNetOS Kernel Module Parameters
# /etc/modprobe.d/pinetos.conf
# ====================================
# Module-specific parameters for RPi 5 hardware optimisation

# ---- I2C ----------------------------------------------------------------
# Disable clock stretching timeout workaround (not needed on BCM2712)
# options i2c-bcm2835 clk_tout_ms=0

# ---- WiFi (BCM43455 / brcmfmac) -----------------------------------------
# Enable 802.11ac (5 GHz) + power-save disable for low-latency
options brcmfmac roamoff=1 feature_disable=0x82000

# ---- USB ----------------------------------------------------------------
# Increase USB hub port reset delay for problematic devices
options usbcore initial_descriptor_timeout=10

# ---- USB Attached SCSI (UAS / USB 3.0 NVMe enclosures) -----------------
# Quirk for some USB-SATA bridges that don't fully support UAS
# options usb-storage quirks=XXXX:YYYY:u

# ---- NVMe ---------------------------------------------------------------
# Reduce NVMe timeout from 30s to 8s for faster error recovery
options nvme_core io_timeout=8

# ---- Bluetooth (RPi 5 onboard BT) ----------------------------------------
# Disable USB autosuspend for HCI device
options btusb reset=1

# ---- Crypto ----------------------------------------------------------------
# Prefer ARM64 hardware-accelerated AES over generic
install aes modprobe aes_arm64; modprobe aes_generic
