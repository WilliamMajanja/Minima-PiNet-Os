# PiNetOS Kernel Modules Configuration
# /etc/modules-load.d/pinetos.conf
# ====================================
# Modules loaded automatically at boot by systemd-modules-load

# --- Core Drivers ---
# I2C
i2c-dev
i2c-bcm2835

# SPI
spi-bcm2835
spidev

# GPIO
gpio-bcm-virt

# PWM
pwm-bcm2835

# --- Networking ---
# WiFi (Broadcom BCM43455 — RPi 5 onboard)
brcmfmac
brcmutil
cfg80211

# WireGuard VPN
wireguard

# Bridge (for container networking)
br_netfilter
bridge
veth

# iptables / nftables
ip_tables
nf_conntrack
nf_nat
xt_conntrack

# --- Storage ---
# NVMe (PCIe Gen 3 on RPi 5)
nvme
nvme-core

# USB storage
uas
usb-storage

# --- Crypto ---
sha256_generic
aes_generic
aes_arm64
ghash_clmulni_intel

# --- Misc ---
# Thermal
bcm2835_thermal

# Watchdog
bcm2835_wdt

# Real-time clock
rtc-ds3231

# 1-Wire
w1-gpio
w1-therm

# CAN bus (for industrial HATs)
# can
# mcp251x
